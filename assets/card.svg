<svg xmlns="http://www.w3.org/2000/svg" width="320" height="460" viewBox="0 0 320 460">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1a78"/><stop offset=".55" stop-color="#6347EE"/><stop offset="1" stop-color="#1a0f4d"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#f0b429"/><stop offset="1" stop-color="#a9741a"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="shape"><path d="M160 6 L306 40 V330 Q306 400 160 454 Q14 400 14 330 V40 Z"/></clipPath>
<style>
text{font-family:'Space Grotesk','IBM Plex Sans',Segoe UI,Arial,sans-serif;fill:url(#gold)}
.ovr{font-size:64px;font-weight:800} .pos{font-size:22px;font-weight:700}
.nm{font-size:25px;font-weight:800;letter-spacing:1.5px} .sv{font-size:27px;font-weight:800}
.sk{font-size:17px;font-weight:600;opacity:.9} .tag{font-size:10px;letter-spacing:3px;font-weight:600}
@keyframes sweep{from{transform:translateX(-340px)}to{transform:translateX(340px)}}
.shine{animation:sweep 4.5s ease-in-out infinite}
</style></defs>
<path d="M160 2 L310 38 V332 Q310 404 160 458 Q10 404 10 332 V38 Z" fill="url(#gold)"/>
