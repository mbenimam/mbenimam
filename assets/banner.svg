<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#150d45"/><stop offset=".6" stop-color="#3a24b8"/><stop offset="1" stop-color="#6347EE"/></linearGradient>
