<style>
text{font-family:'Space Grotesk','IBM Plex Sans','Segoe UI',Arial,sans-serif}
.n{font-size:46px;font-weight:800;fill:#fff}.t{font-size:20px;font-weight:600;fill:url(#gold)}.s{font-size:15px;fill:#d8d2ff;letter-spacing:.5px}
@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
